name: ci

# Fast CI verification for pull requests and manual dispatch.
# Runs compiler checks, unit tests, and validation to ensure code is stable before merging to main.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'art/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew and scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*/*.sh 2>/dev/null || chmod +x gradlew scripts/*.sh

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Cache PRoot binaries
        id: cache-proot
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a
          key: proot-jni-${{ hashFiles('scripts/fetch-proot.sh', 'patches/proot/**') }}

      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs
          key: sherpa-onnx-aar-2.0.1

      - name: Setup toolchain
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          if [ ! -d "$ANDROID_HOME/ndk/$ndk" ]; then
            echo "Installing NDK $ndk via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          else
            echo "NDK $ndk restored from cache."
          fi

          if [ -f "app/src/main/jniLibs/arm64-v8a/libproot.so" ] && [ -f "app/src/main/jniLibs/arm64-v8a/.source" ]; then
            echo "PRoot binaries restored from cache; skipping build."
          else
            echo "Building PRoot binaries from source..."
            sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
            bash scripts/fetch-proot.sh
          fi

      - name: Run unit and compiler tests
        run: ./gradlew :owl:test :app:testFossDebugUnitTest :owl:owlJar
