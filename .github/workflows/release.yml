name: release

# Builds a signed release APK on every push to main, tag creation, or manual dispatch,
# and publishes a new GitHub Release with the APK and checksums attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew and scripts executable
        run: chmod +x gradlew scripts/*.sh scripts/*/*.sh 2>/dev/null || chmod +x gradlew scripts/*.sh

      - name: Determine version and release tag
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${name}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved version $name (code $code) with tag $tag"

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          bash scripts/fetch-proot.sh

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "KEYSTORE_BASE64 not configured; generating a standalone release key for packaging"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/upload.jks" -alias mylauncher \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=MyLauncher, OU=Dev, O=Dhawan, L=Bengaluru, ST=KA, C=IN"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$RUNNER_TEMP/upload.jks" "android" "mylauncher" "android" > keystore.properties
          fi

      - name: Test and build release APK
        run: ./gradlew :owl:test :app:testFossDebugUnitTest :app:lintFossDebug :app:assembleFossRelease :app:bundlePlayRelease

      - name: Checksum and package outputs
        id: apk
        run: |
          tag="${{ steps.version.outputs.tag }}"
          apk="mylauncher-${tag}.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS
          echo "file=$apk" >> "$GITHUB_OUTPUT"

          [ -f app/build/outputs/mapping/fossRelease/mapping.txt ] && cp app/build/outputs/mapping/fossRelease/mapping.txt "mapping-${{ steps.version.outputs.name }}.txt" || true
          [ -f app/build/outputs/mapping/playRelease/mapping.txt ] && cp app/build/outputs/mapping/playRelease/mapping.txt "mapping-play-${{ steps.version.outputs.name }}.txt" || true

      - uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: ${{ steps.apk.outputs.file }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="${{ steps.apk.outputs.file }}"
          tag="${{ steps.version.outputs.tag }}"
          notes="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"

          EXTRA_FILES=()
          [ -f "SHA256SUMS" ] && EXTRA_FILES+=("SHA256SUMS")
          [ -f "mapping-${{ steps.version.outputs.name }}.txt" ] && EXTRA_FILES+=("mapping-${{ steps.version.outputs.name }}.txt")
          [ -f "mapping-play-${{ steps.version.outputs.name }}.txt" ] && EXTRA_FILES+=("mapping-play-${{ steps.version.outputs.name }}.txt")

          NOTES_OPT=()
          if [ -f "$notes" ]; then
            NOTES_OPT=(--notes-file "$notes")
          else
            NOTES_OPT=(--generate-notes)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating release assets"
            gh release upload "$tag" "$apk" "${EXTRA_FILES[@]}" --clobber
          else
            echo "Creating GitHub Release $tag"
            gh release create "$tag" "$apk" "${EXTRA_FILES[@]}" \
              --title "My Launcher $tag" \
              "${NOTES_OPT[@]}" \
              --target "$GITHUB_SHA"
          fi
